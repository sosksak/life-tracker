

<!-- FOCUS MODE OVERLAY -->
<div class="focus-overlay hidden" id="focusOverlay">
  <div class="focus-sub">⚡ РЕЖИМ ФОКУСА</div>
  <div class="focus-timer" id="focusTimer">00:00:00</div>
  <div class="focus-earn" id="focusEarn">~0 ₽</div>

</div>

<!-- FORTUNE WHEEL MODAL -->
<div class="modal-overlay" id="wheelModal">
  <div class="modal-content" style="max-width:340px">
    <div class="modal-title">🎡 Колесо бонусов</div>
    <div class="wheel-modal-inner">
      <div class="wheel-canvas-wrap">
        <div class="wheel-pointer">▼</div>
        <canvas id="wheelCanvas" width="280" height="280"></canvas>
      </div>
      <button class="wheel-spin-btn" id="wheelSpinBtn" onclick="spinWheel()">🎰 КРУТИТЬ (120 XP)</button>
      <div class="wheel-result" id="wheelResult"></div>
    </div>
    <button class="modal-close-btn" onclick="closeWheelModal()">Закрыть</button>
  </div>
</div>

<!-- ============ MODAL: KOPILKA SETUP ============ -->
<div class="modal-overlay" id="kopilkaModal">
  <div class="modal-content" style="max-width:320px">
    <div class="modal-title">🎯 Настрой копилку</div>
    <div style="display:flex;flex-direction:column;gap:10px;">
      <input type="text" id="kopilkaNameInput" placeholder="На что копишь? (напр. Квартира)" class="manual-input" style="width:100%">
      <input type="number" id="kopilkaGoalInput" placeholder="Сколько нужно ₽?" class="manual-input" style="width:100%">
      <button class="modal-save-btn" onclick="saveKopilka()">💾 Сохранить</button>
    </div>
    <button class="modal-close-btn" onclick="closeKopilkaModal()">Отмена</button>
  </div>
</div>
